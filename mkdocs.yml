site_name: wrapido
site_description: A WP-CLI-style command line tool for talking to any WordPress site's REST API over HTTP.
site_url: https://spacedmonkey.github.io/wrapido/
repo_url: https://github.com/spacedmonkey/wrapido
repo_name: spacedmonkey/wrapido
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Pagination: pagination.md
  - Help: help.md
  - Authentication:
      - Overview: authentication.md
      - Application Passwords: authentication-application-passwords.md
      - OAuth2: authentication-oauth2.md
  - Configuration: configuration.md
  - Meta commands: meta-commands.md
  - Uploading files: uploading-files.md
  - Agent mode: agent-mode.md
  - Examples: examples.md
  - Tags: tags.md
  - Contributing: contributing.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - tags

copyright: >
  Designed by <a href="https://spacedmonkey.com" target="_blank" rel="noopener">Spacedmonkey</a>

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/spacedmonkey/wrapido
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/thespacedmonkey
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jonathandavidharris/
