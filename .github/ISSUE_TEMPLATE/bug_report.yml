name: Bug report
description: Report a problem with wp-rest-cli
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below so it can be reproduced and fixed.

  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact `wp-rest-cli` (or `npm run wp -- ...`) command that triggered the problem.
      render: sh
      placeholder: |
        wp-rest-cli wp/v2 posts list --url=https://example.com --per_page=5
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the full error output or stack trace if there is one.
      render: sh
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: wp-rest-cli version
      description: Output of `wp-rest-cli --version` (or the npm package version you installed).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: wordpress
    attributes:
      label: WordPress version / REST API details
      description: If known - the target site's WordPress version, whether it's self-hosted or WordPress.com/VIP, any relevant plugins that add or modify REST routes, and authentication method used.
      placeholder: |
        WordPress 6.6, self-hosted, Application Password auth, no unusual plugins
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help - e.g. only reproduces against a specific site, only with certain flags, etc.
    validations:
      required: false
